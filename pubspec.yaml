name: yt_downloader
description: "Zylos – A beautiful cross-platform media downloader supporting Android & Windows."
publish_to: 'none'

version: 3.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # UI / UX
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  cached_network_image: ^3.3.1

  # Core logic & Data
  youtube_explode_dart: ^3.1.0
  dio: ^5.4.0
  provider: ^6.1.1
  uuid: ^4.3.3

  # Storage & Permissions
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.5
  file_picker: ^8.0.0
  # permission_handler: ^11.3.0 - Removed for Windows-only

  # System integrations
  open_file: ^3.3.2
  url_launcher: ^6.3.2
  # flutter_local_notifications: ^17.0.0 - Removed for Windows-only
  connectivity_plus: ^6.0.3
  # ffmpeg_kit_flutter_full_gpl: ^6.0.3 - Removed for Windows-only (uses native exe)


  path: ^1.9.1
  http: ^1.6.0
  share_plus: ^12.0.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  flutter_native_splash: ^2.4.7
  bitsdojo_window: ^0.1.6
  window_manager: ^0.5.1
  tray_manager: ^0.5.2
  windows_single_instance: ^1.1.0
  package_info_plus: ^9.0.1
  desktop_drop: ^0.4.4
  win32: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.1
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: false
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 256
